<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main">
    <section class="section section--scanner" id="platform">
      <div class="container container--wide">

        <!-- Buying alerts -->
        <div class="terminal" role="region" aria-labelledby="buying-title" data-tone="bull">
          <div class="terminal-bar">
            <span class="terminal-title" id="buying-title">New HoD</span>
            <div class="terminal-tools">
              <button type="button" class="icon-btn sound-icon" data-sound aria-pressed="false" aria-label="Alert sound for New HoD" title="Alert sound">
                <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
              </button>
              <button type="button" class="icon-btn config-icon" aria-label="Settings for New HoD" title="Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
              </button>
              <button type="button" class="icon-btn detach-icon" aria-label="Detach New HoD into its own window" title="Detach">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="m20 4-8 8"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
              </button>
            </div>
          </div>

          <div class="table-wrap" tabindex="0" aria-label="New HoD alerts">
            <table class="scan-table">
              <thead><tr></tr></thead>
              <tbody></tbody>
            </table>
          </div>

          <!-- Phones: the same alerts as cards -->
          <div class="card-list" data-cards aria-label="New HoD alerts"></div>
        </div>

        <!-- Selling alerts -->
        <div class="terminal" role="region" aria-labelledby="selling-title" data-tone="bear">
          <div class="terminal-bar">
            <span class="terminal-title" id="selling-title">Selling Spikes</span>
            <div class="terminal-tools">
              <button type="button" class="icon-btn sound-icon" data-sound aria-pressed="false" aria-label="Alert sound for Selling Spikes" title="Alert sound">
                <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
              </button>
              <button type="button" class="icon-btn config-icon" aria-label="Settings for Selling Spikes" title="Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
              </button>
              <button type="button" class="icon-btn detach-icon" aria-label="Detach Selling Spikes into its own window" title="Detach">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="m20 4-8 8"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
              </button>
            </div>
          </div>

          <div class="table-wrap" tabindex="0" aria-label="Selling Spikes alerts">
            <table class="scan-table">
              <thead><tr></tr></thead>
              <tbody></tbody>
            </table>
          </div>

          <!-- Phones: the same alerts as cards -->
          <div class="card-list" data-cards aria-label="Selling Spikes alerts"></div>
        </div>

        <!-- Trading halts -->
        <div class="terminal" role="region" aria-labelledby="halts-title" data-tone="halt">
          <div class="terminal-bar">
            <span class="terminal-title" id="halts-title">Halts</span>
            <div class="terminal-tools">
              <button type="button" class="icon-btn sound-icon" data-sound aria-pressed="false" aria-label="Alert sound for Halts" title="Alert sound">
                <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
              </button>
              <button type="button" class="icon-btn config-icon" aria-label="Settings for Halts" title="Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
              </button>
              <button type="button" class="icon-btn detach-icon" aria-label="Detach Halts into its own window" title="Detach">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="m20 4-8 8"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
              </button>
            </div>
          </div>

          <div class="table-wrap" tabindex="0" aria-label="Halts alerts">
            <table class="scan-table">
              <thead><tr></tr></thead>
              <tbody></tbody>
            </table>
          </div>

          <!-- Phones: the same alerts as cards -->
          <div class="card-list" data-cards aria-label="Halts alerts"></div>
        </div>

      </div>
    </section>
  </main>
  <script src="scanner.js"></script>
</body>
</html>
